name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del repositorio
        run: |
          echo "📁 Contenido del repositorio:"
          ls -la
          echo ""
          echo "📦 Verificando directorios clave:"
          [ -d "wp-content" ] && echo "✓ wp-content encontrado" || echo "✗ wp-content NO encontrado"
          [ -d "wp-admin" ] && echo "✓ wp-admin encontrado" || echo "✗ wp-admin NO encontrado"

      - name: Verificar archivos de configuración
        run: |
          echo "🔧 Archivos de configuración:"
          [ -f "wp-config.php" ] && echo "✓ wp-config.php existe" || echo "✗ wp-config.php NO existe"
          [ -f ".github/workflows/cd.yml" ] && echo "✓ Workflow existe" || echo "✗ Workflow NO existe"

  validation:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Diagnóstico de variables (debug)"
        run: |
          echo "🔍 DIAGNÓSTICO DE VARIABLES"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Variables disponibles:"
          echo "   Este job (validation) no tiene acceso al ambiente 'hosting'"
          echo "   Las variables se validan en el job 'validate-deployment-vars'"
          echo ""
          echo "📋 Información del workflow:"
          echo "     - Rama: ${{ github.ref }}"
          echo "     - Job: validation (diagnóstico)"
          echo "     - Repositorio: ${{ github.repository }}"
          echo ""
          echo "💡 PRÓXIMO PASO:"
          echo "   Configura las variables en:"
          echo "   Settings > Secrets and variables > Actions > Variables"
          echo ""
          echo "   Variables requeridas:"
          echo "     - DEPLOY_USER"
          echo "     - DEPLOY_HOST"
          echo "     - DEPLOY_PORT"
          echo ""
          echo "   Secretos requeridos:"
          echo "     - DEPLOY_PASSWORD"
          echo ""

      - name: "2️⃣ Información sobre validación"
        run: |
          echo "✅ Validación de conectividad"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Este step:"
          echo "   - Se ejecuta en el job 'validation' (sin ambiente)"
          echo "   - No puede acceder a las variables del ambiente 'hosting'"
          echo ""
          echo "📋 Validación de conectividad SSH:"
          echo "   - Se realiza en el job 'validate-deployment-vars'"
          echo "   - Requiere que las variables estén configuradas"
          echo "   - Incluye diagnóstico detallado si fallan"
          echo ""

  validate-deployment-vars:
    runs-on: ubuntu-latest
    needs: checkout
    environment: hosting
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Validar variables de despliegue (con ambiente hosting)"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔐 VALIDACIÓN DE VARIABLES DE DESPLIEGUE"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Contexto:"
          echo "   Job: validate-deployment-vars"
          echo "   Ambiente: hosting"
          echo "   Rama: ${{ github.ref }}"
          echo ""
          echo "🔍 Verificando variables..."
          echo ""
          
          ERRORS=0
          
          if [ -n "$DEPLOY_USER" ]; then
            echo "✓ DEPLOY_USER: $DEPLOY_USER"
          else
            echo "✗ DEPLOY_USER: (vacío o no configurado)"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ -n "$DEPLOY_HOST" ]; then
            echo "✓ DEPLOY_HOST: $DEPLOY_HOST"
          else
            echo "✗ DEPLOY_HOST: (vacío o no configurado)"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ -n "$DEPLOY_PORT" ]; then
            echo "✓ DEPLOY_PORT: $DEPLOY_PORT"
            
            # Validaciones adicionales
            if [ "$DEPLOY_PORT" != "21" ]; then
              echo "   ✗ ERROR: Se requiere Puerto 21 (FTP)"
              ERRORS=$((ERRORS + 1))
            elif [ "$DEPLOY_PORT" -lt 1 ] || [ "$DEPLOY_PORT" -gt 65535 ]; then
              echo "   ✗ ERROR: Puerto fuera de rango válido (1-65535)"
              ERRORS=$((ERRORS + 1))
            fi
          else
            echo "✗ DEPLOY_PORT: (vacío o no configurado)"
            ERRORS=$((ERRORS + 1))
          fi
          
          if [ -n "$DEPLOY_PASSWORD" ]; then
            echo "✓ DEPLOY_PASSWORD: (configurado, longitud: ${#DEPLOY_PASSWORD} caracteres)"
          else
            echo "✗ DEPLOY_PASSWORD: (vacío o no configurado)"
            ERRORS=$((ERRORS + 1))
          fi
          
          echo ""
          echo "════════════════════════════════════════"
          
          if [ $ERRORS -eq 0 ]; then
            echo "✅ Todas las variables configuradas correctamente"
            exit 0
          else
            echo "❌ ERROR: $ERRORS variable(s) faltante(s) o inválida(s)"
            echo ""
            echo "💡 Solución:"
            echo "   1. Ir a: Settings > Secrets and variables > Actions"
            echo "   2. Crear variables (Variables tab):"
            echo "      - DEPLOY_USER: (nombre de usuario FTP)"
            echo "      - DEPLOY_HOST: (dominio o IP)"
            echo "      - DEPLOY_PORT: 21 (puerto FTP)"
            echo "   3. Crear secret (Secrets tab):"
            echo "      - DEPLOY_PASSWORD: (contraseña FTP)"
            echo "   4. Asegurar que el environment 'hosting' tiene acceso"
            echo ""
            exit 1
          fi

      - name: "2️⃣ Diagnóstico adicional"
        if: failure()
        run: |
          echo "🔍 INFORMACIÓN DIAGNÓSTICA"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Información del repositorio:"
          echo "   Repositorio: ${{ github.repository }}"
          echo "   Rama: ${{ github.ref }}"
          echo "   Commit: ${{ github.sha }}"
          echo ""
          echo "🏠 Ambientes configurados:"
          echo "   Este workflow requiere el ambiente 'hosting'"
          echo "   Verifica que exista en Settings > Environments"
          echo ""
          echo "🔐 Variables del repositorio:"
          echo "   Settings > Secrets and variables > Actions > Variables"
          echo ""
          echo "🔑 Secretos del repositorio:"
          echo "   Settings > Secrets and variables > Actions > Secrets"
          echo ""

      - name: "3️⃣ Validar conectividad FTP (Puerto 21)"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔗 Validando conectividad FTP"
          echo "════════════════════════════════════════"
          echo ""
          
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PORT" ] || [ -z "$DEPLOY_USER" ]; then
            echo "⚠️  ADVERTENCIA: Variables FTP incompletas"
            echo "   No se puede validar conectividad"
            exit 0
          fi
          
          echo "   Host: $DEPLOY_HOST"
          echo "   Puerto: $DEPLOY_PORT"
          echo "   Usuario: $DEPLOY_USER"
          echo ""
          
          # Validar que se usa puerto 21 (FTP)
          if [ "$DEPLOY_PORT" != "21" ]; then
            echo "❌ ERROR: Puerto inválido para FTP"
            echo "   Se requiere: Puerto 21 (FTP)"
            echo "   Se detectó: Puerto $DEPLOY_PORT"
            echo ""
            exit 1
          fi
          
          # Instalar lftp si no está disponible
          if ! command -v lftp &> /dev/null; then
            echo "📦 Instalando lftp..."
            sudo apt-get update &> /dev/null
            sudo apt-get install -y lftp &> /dev/null
          fi
          
          echo "🔄 Escaneando puerto FTP (21)..."
          
          # Intentar conexión FTP
          if lftp -e "set ftp:ssl-allow no; set net:timeout 15; connect -u $DEPLOY_USER,$DEPLOY_PASSWORD $DEPLOY_HOST:$DEPLOY_PORT; quit" 2>&1 | grep -q "total"; then
            echo "✓ Conexión FTP exitosa"
            echo "   Host accesible en puerto 21"
          else
            # Intentar con telnet como fallback
            if timeout 5 bash -c "</dev/tcp/$DEPLOY_HOST/21" 2>/dev/null; then
              echo "✓ Puerto 21 (FTP) está abierto"
              echo "   Nota: No se pudo autenticar, verifica credenciales"
            else
              echo "❌ No se pudo conectar a $DEPLOY_HOST:21"
              echo "   Verifica: host, puerto y firewall"
              exit 1
            fi
          fi
        continue-on-error: false

  prepare:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [checkout, validation, validate-deployment-vars]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Instalar dependencias"
        run: |
          echo "📦 Instalando dependencias necesarias..."
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: "2️⃣ Validar variables de despliegue"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/validate-env.sh

      - name: "3️⃣ Verificar archivos locales"
        run: |
          echo "📂 Estado del repositorio local:"
          pwd
          echo ""
          echo "📋 Archivos en raíz:"
          ls -la | head -20
          echo ""
          echo "📊 Estadísticas:"
          echo "   Total de archivos: $(find . -type f | wc -l)"
          echo "   Total de directorios: $(find . -type d | wc -l)"
          echo "   Tamaño total: $(du -sh . | cut -f1)"

      - name: "4️⃣ Verificar conectividad FTP"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔗 Prueba de conectividad FTP"
          echo "════════════════════════════════════════"
          echo ""
          
          lftp -e "set ftp:ssl-allow no; set net:timeout 10; connect -u $DEPLOY_USER,$DEPLOY_PASSWORD $DEPLOY_HOST:$DEPLOY_PORT; ls -la; quit" 2>&1 | head -30
          
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo ""
            echo "✓ Conectividad FTP verificada exitosamente"
          else
            echo ""
            echo "⚠️  Advertencia en conectividad FTP"
          fi

      - name: "✅ Preparación completada"
        run: |
          echo "════════════════════════════════════════"
          echo "✅ JOB PREPARE: Completado exitosamente"
          echo "════════════════════════════════════════"
          echo ""
          echo "✓ Credenciales validadas"
          echo "✓ Archivos locales verificados"
          echo "✓ Dependencias instaladas"
          echo "✓ Conectividad FTP verificada"
          echo ""
          echo "Próximo: Transfer & Deploy (vía FTP Puerto 21)"
          echo "════════════════════════════════════════"

  transfer:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [prepare]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Instalar dependencias"
        run: |
          echo "📦 Instalando dependencias..."
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: "2️⃣ Pre-validación de variables"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔍 PRE-VALIDACIÓN DE TRANSFERENCIA FTP"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Parámetros:"
          echo "   Usuario: $DEPLOY_USER"
          echo "   Host: $DEPLOY_HOST"
          echo "   Puerto: $DEPLOY_PORT"
          echo "   Contraseña: ${#DEPLOY_PASSWORD} caracteres"
          echo ""
          
          if [ "$DEPLOY_PORT" != "21" ]; then
            echo "⚠️  ADVERTENCIA:"
            echo "   Se espera Puerto 21 (FTP)"
            echo "   Se detectó: Puerto $DEPLOY_PORT"
            echo "   Verifica la configuración si no es correcto"
            echo ""
          fi
          
          echo "📂 Archivos a transferir:"
          echo "   Total: $(find . -type f | wc -l) archivos"
          echo "   Tamaño: $(du -sh . | cut -f1)"
          echo ""

      - name: "3️⃣ Transferir archivos vía FTP"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🚀 INICIANDO TRANSFERENCIA FTP"
          echo "════════════════════════════════════════"
          bash scripts/transfer-files.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD" "." "/var/www/html/instituto"
        continue-on-error: false

      - name: "✅ Transferencia completada"
        if: success()
        run: |
          echo "════════════════════════════════════════"
          echo "✅ JOB TRANSFER: Completado exitosamente"
          echo "════════════════════════════════════════"
          echo ""
          echo "✓ Archivos transferidos al servidor"
          echo "✓ Procedimiento: FTP (Puerto 21)"
          echo ""
          echo "Próximo: Deploy"
          echo "════════════════════════════════════════"

      - name: "❌ Diagnóstico en caso de fallo"
        if: failure()
        run: |
          echo "════════════════════════════════════════"
          echo "❌ JOB TRANSFER: Falló"
          echo "════════════════════════════════════════"
          echo ""
          echo "🔍 DIAGNÓSTICO:"
          echo ""
          echo "1. Verificar credenciales FTP:"
          echo "   - DEPLOY_USER debe estar configurado"
          echo "   - DEPLOY_HOST debe ser accesible"
          echo "   - DEPLOY_PORT debe ser 21 (FTP)"
          echo "   - DEPLOY_PASSWORD debe ser correcto"
          echo ""
          echo "2. Verificar Puerto:"
          echo "   - Puerto 21 es el puerto FTP estándar"
          echo "   - Verifica: Settings > Secrets and variables > Actions"
          echo ""
          echo "3. Verificar conectividad FTP:"
          echo "   - El host debe estar online"
          echo "   - Firewall no debe bloquear el puerto 21"
          echo "   - FTP debe estar habilitado en el servidor"
          echo ""
          echo "4. Revisar logs:"
          echo "   - Ver output anterior para detalles"
          echo "   - Buscar 'ERROR' o 'timeout' en los logs"
          echo ""
          echo "5. Permisos:"
          echo "   - Usuario FTP debe tener permisos para escribir"
          echo "   - Directorio remoto debe existir"
          echo "════════════════════════════════════════"

  deploy:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [transfer]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Instalar dependencias"
        run: |
          echo "📦 Instalando dependencias..."
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: "2️⃣ Verificar archivos remoto antes de deploy"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔍 VERIFICACIÓN PRE-DEPLOY"
          echo "════════════════════════════════════════"
          echo ""
          echo "📂 Verificando contenido remoto vía FTP..."
          echo ""
          
          lftp -e "
            set ftp:ssl-allow no
            set net:timeout 30
            connect -u $DEPLOY_USER,$DEPLOY_PASSWORD $DEPLOY_HOST:$DEPLOY_PORT
            cd /var/www/html/instituto
            ls -la | head -20
            quit
          " 2>&1 || true
          
          echo ""

      - name: "3️⃣ Ejecutar script de despliegue"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "⚙️  EJECUTANDO DEPLOY"
          echo "════════════════════════════════════════"
          echo ""
          echo "📋 Información:"
          echo "   Usuario: $DEPLOY_USER"
          echo "   Host: $DEPLOY_HOST:$DEPLOY_PORT (FTP)"
          echo "   Directorio: /var/www/html/instituto"
          echo ""
          bash scripts/run-deploy.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD" "/var/www/html/instituto"

      - name: "4️⃣ Verificar archivos desplegados"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/verify-deploy.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD" "/var/www/html/instituto"
        continue-on-error: true

      - name: "✅ Despliegue completado"
        if: success()
        run: |
          echo "════════════════════════════════════════════════════"
          echo "✅ JOB DEPLOY: Completado exitosamente"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "✓ Script de despliegue ejecutado"
          echo "✓ Archivos verificados"
          echo "✓ Despliegue finalizado"
          echo ""
          echo "Puedes acceder a tu sitio en: https://$DEPLOY_HOST"
          echo "════════════════════════════════════════════════════"

      - name: "❌ Diagnóstico en caso de fallo"
        if: failure()
        run: |
          echo "════════════════════════════════════════════════════"
          echo "❌ JOB DEPLOY: Falló"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "🔍 Posibles causas:"
          echo ""
          echo "1. Script deploy.sh no encontrado:"
          echo "   - Debe existir en: /var/www/html/instituto/deploy.sh"
          echo "   - O en: scripts/ localmente"
          echo ""
          echo "2. Error de permisos:"
          echo "   - Usuario $DEPLOY_USER debe tener permisos"
          echo "   - El directorio debe ser escribible"
          echo ""
          echo "3. Error de sintaxis en deploy.sh:"
          echo "   - Revisar la salida anterior para detalles"
          echo "   - Usar: bash -x para debug"
          echo ""
          echo "4. Dependencias faltantes:"
          echo "   - Verificar que deploy.sh tenga las dependencias"
          echo "   - PHP, Composer, Node, etc."
          echo ""
          echo "5. Conectividad FTP:"
          echo "   - Verificar que FTP siga siendo accesible"
          echo "   - Los archivos se transferirán vía FTP (puerto 21)"
          echo ""
          echo "Revisa los logs anteriores para más detalles"
          echo "════════════════════════════════════════════════════"
        
