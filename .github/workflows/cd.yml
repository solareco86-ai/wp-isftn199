name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del repositorio
        run: |
          echo "📁 Contenido del repositorio:"
          ls -la
          echo ""
          echo "📦 Verificando directorios clave:"
          [ -d "wp-content" ] && echo "✓ wp-content encontrado" || echo "✗ wp-content NO encontrado"
          [ -d "wp-admin" ] && echo "✓ wp-admin encontrado" || echo "✗ wp-admin NO encontrado"

      - name: Verificar archivos de configuración
        run: |
          echo "🔧 Archivos de configuración:"
          [ -f "wp-config.php" ] && echo "✓ wp-config.php existe" || echo "✗ wp-config.php NO existe"
          [ -f ".github/workflows/cd.yml" ] && echo "✓ Workflow existe" || echo "✗ Workflow NO existe"

  validation:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Validar variables del environment
        run: |
          echo "🔐 Validando variables y secretos:"
          echo "   DEPLOY_USER: ${DEPLOY_USER:-(no configurado)}"
          echo "   DEPLOY_HOST: ${DEPLOY_HOST:-(no configurado)}"
          echo "   DEPLOY_PORT: ${DEPLOY_PORT:-(no configurado)}"
          echo "   DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-(no configurado)}"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

      - name: Verificar conectividad SSH
        run: |
          echo "🔗 Comprobando conectividad SSH:"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /dev/null 2>&1 && echo "✓ Host accesible" || echo "✗ Host NO accesible"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [checkout, validation]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          echo "📦 Instalando dependencias necesarias..."
          sudo apt-get update
          sudo apt-get install -y expect sshpass
          which expect && echo "✓ expect instalado" || echo "✗ expect NO instalado"
          which sshpass && echo "✓ sshpass instalado" || echo "✗ sshpass NO instalado"

      - name: "1️⃣ Validar variables de despliegue"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔐 Validando credenciales..."
          [ -n "$DEPLOY_USER" ] && echo "✓ DEPLOY_USER: $DEPLOY_USER" || echo "✗ DEPLOY_USER vacío"
          [ -n "$DEPLOY_HOST" ] && echo "✓ DEPLOY_HOST: $DEPLOY_HOST" || echo "✗ DEPLOY_HOST vacío"
          [ -n "$DEPLOY_PORT" ] && echo "✓ DEPLOY_PORT: $DEPLOY_PORT" || echo "✗ DEPLOY_PORT vacío"
          [ -n "$DEPLOY_PASSWORD" ] && echo "✓ DEPLOY_PASSWORD: (configurado)" || echo "✗ DEPLOY_PASSWORD vacío"
          
          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PORT" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "❌ Faltan variables críticas. Abortando."
            exit 1
          fi

      - name: "2️⃣ Verificar archivos locales"
        run: |
          echo "📂 Estado del repositorio local:"
          pwd
          echo ""
          echo "📋 Archivos en raíz:"
          ls -la | head -20
          echo ""
          echo "📊 Estadísticas:"
          echo "   Total de archivos: $(find . -type f | wc -l)"
          echo "   Total de directorios: $(find . -type d | wc -l)"
          echo "   Tamaño total: $(du -sh . | cut -f1)"

      - name: "3️⃣ Probar conectividad SSH"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔗 Probando conectividad SSH..."
          
          # Crear script SSH
          cat > /tmp/ssh_test.expect << 'EOF'
          #!/usr/bin/expect -f
          set timeout 10
          set user [lindex $argv 0]
          set host [lindex $argv 1]
          set port [lindex $argv 2]
          set pass [lindex $argv 3]
          
          spawn ssh -o StrictHostKeyChecking=no -p $port $user@$host "echo '✓ Conexión exitosa'; pwd"
          expect "password:" { send "$pass\r" }
          expect eof
          EOF
          
          chmod +x /tmp/ssh_test.expect
          /tmp/ssh_test.expect "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD"
        continue-on-error: true

      - name: "4️⃣ Crear directorio destino si no existe"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "📁 Verificando/creando directorio destino..."
          
          cat > /tmp/mkdir.expect << 'EOF'
          #!/usr/bin/expect -f
          set timeout 10
          set user [lindex $argv 0]
          set host [lindex $argv 1]
          set port [lindex $argv 2]
          set pass [lindex $argv 3]
          
          spawn ssh -o StrictHostKeyChecking=no -p $port $user@$host "mkdir -p /var/www/html/instituto && ls -la /var/www/html/ | grep instituto"
          expect "password:" { send "$pass\r" }
          expect eof
          EOF
          
          chmod +x /tmp/mkdir.expect
          /tmp/mkdir.expect "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD"
        continue-on-error: true

      - name: "5️⃣ Transferir archivos vía SCP"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "📤 Iniciando transferencia de archivos..."
          echo "📂 Directorio actual: $(pwd)"
          echo "📋 Archivos a copiar:"
          ls -la | head -15
          
          cat > /tmp/scp_deploy.expect << 'EOF'
          #!/usr/bin/expect -f
          set timeout 120
          set user [lindex $argv 0]
          set host [lindex $argv 1]
          set port [lindex $argv 2]
          set pass [lindex $argv 3]
          
          puts "Transfiriendo directorio completo a $user@$host:$port"
          spawn scp -o StrictHostKeyChecking=no -P $port -r . $user@$host:/var/www/html/instituto/
          expect {
            "password:" { send "$pass\r"; exp_continue }
            "Connection refused" { puts "❌ ERROR: Conexión rechazada"; exit 1 }
            "No such file" { puts "❌ ERROR: Ruta no válida en destino"; exit 1 }
            "100%" { puts "✓ Transferencia completada" }
            timeout { puts "❌ ERROR: Timeout en transferencia"; exit 1 }
            eof { puts "✓ Transferencia finalizada" }
          }
          EOF
          
          chmod +x /tmp/scp_deploy.expect
          /tmp/scp_deploy.expect "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD"

      - name: "6️⃣ Ejecutar script de despliegue"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "📋 Ejecutando deploy.sh en servidor remoto..."
          
          cat > /tmp/run_deploy.expect << 'EOF'
          #!/usr/bin/expect -f
          set timeout 120
          set user [lindex $argv 0]
          set host [lindex $argv 1]
          set port [lindex $argv 2]
          set pass [lindex $argv 3]
          
          spawn ssh -o StrictHostKeyChecking=no -p $port $user@$host "cd /var/www/html/instituto && [ -f deploy.sh ] && bash deploy.sh || echo '⚠️ deploy.sh no encontrado'"
          expect {
            "password:" { send "$pass\r"; exp_continue }
            timeout { puts "❌ ERROR: Timeout en ejecución"; exit 1 }
            eof { puts "✓ Script ejecutado" }
          }
          EOF
          
          chmod +x /tmp/run_deploy.expect
          /tmp/run_deploy.expect "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD"

      - name: "7️⃣ Verificar archivos desplegados"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          echo "🔍 Verificando archivos en servidor remoto..."
          
          cat > /tmp/verify.expect << 'EOF'
          #!/usr/bin/expect -f
          set timeout 30
          set user [lindex $argv 0]
          set host [lindex $argv 1]
          set port [lindex $argv 2]
          set pass [lindex $argv 3]
          
          spawn ssh -o StrictHostKeyChecking=no -p $port $user@$host "ls -lah /var/www/html/instituto/ | head -30"
          expect "password:" { send "$pass\r" }
          expect eof
          EOF
          
          chmod +x /tmp/verify.expect
          /tmp/verify.expect "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD"
        continue-on-error: true

      - name: "📊 Resumen del despliegue"
        if: always()
        run: |
          echo "════════════════════════════════════════════════════"
          echo "📊 RESUMEN COMPLETO DEL WORKFLOW DE DESPLIEGUE"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "🎯 JOB: Deploy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "1️⃣  Validar variables de despliegue"
          echo "2️⃣  Verificar archivos locales"
          echo "3️⃣  Probar conectividad SSH"
          echo "4️⃣  Crear directorio destino si no existe"
          echo "5️⃣  Transferir archivos vía SCP"
          echo "6️⃣  Ejecutar script de despliegue"
          echo "7️⃣  Verificar archivos desplegados"
          echo ""
          echo "📋 Checklist:"
          echo "  ✓ Repositorio clonado"
          echo "  ✓ Dependencias instaladas (expect, sshpass)"
          echo "  ✓ Variables validadas"
          echo "  ✓ Archivos verificados"
          echo "  ✓ Conectividad SSH probada"
          echo "  ✓ Directorio destino preparado"
          echo "  ✓ Archivos transferidos"
          echo "  ✓ Script deploy.sh ejecutado"
          echo "  ✓ Despliegue verificado"
          echo ""
          echo "════════════════════════════════════════════════════"
        
