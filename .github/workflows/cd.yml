name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del repositorio
        run: |
          echo "📁 Contenido del repositorio:"
          ls -la
          echo ""
          echo "📦 Verificando directorios clave:"
          [ -d "wp-content" ] && echo "✓ wp-content encontrado" || echo "✗ wp-content NO encontrado"
          [ -d "wp-admin" ] && echo "✓ wp-admin encontrado" || echo "✗ wp-admin NO encontrado"

      - name: Verificar archivos de configuración
        run: |
          echo "🔧 Archivos de configuración:"
          [ -f "wp-config.php" ] && echo "✓ wp-config.php existe" || echo "✗ wp-config.php NO existe"
          [ -f ".github/workflows/cd.yml" ] && echo "✓ Workflow existe" || echo "✗ Workflow NO existe"

  validation:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Validar variables del environment
        run: |
          echo "🔐 Validando variables y secretos:"
          echo "   DEPLOY_USER: ${DEPLOY_USER:-(no configurado)}"
          echo "   DEPLOY_HOST: ${DEPLOY_HOST:-(no configurado)}"
          echo "   DEPLOY_PORT: ${DEPLOY_PORT:-(no configurado)}"
          echo "   DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-(no configurado)}"
          
          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PORT" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "❌ ERROR: Faltan variables críticas"
            exit 1
          fi
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

      - name: Verificar conectividad SSH
        run: |
          echo "🔗 Comprobando conectividad SSH..."
          echo "   Intentando: $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT"
          
          # Validar que el puerto sea el correcto (no FTP)
          if [ "$DEPLOY_PORT" = "21" ]; then
            echo "⚠️ ADVERTENCIA: Puerto 21 detectado. SSH normalmente usa 22."
          fi
          
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" 2>&1 | tee /tmp/keyscan.log
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✓ Host accesible en puerto $DEPLOY_PORT"
          else
            echo "✗ No se pudo conectar al host"
            cat /tmp/keyscan.log
          fi
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        continue-on-error: true

  prepare:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [checkout, validation]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Instalar dependencias"
        run: |
          echo "📦 Instalando dependencias necesarias..."
          sudo apt-get update
          sudo apt-get install -y expect sshpass

      - name: "2️⃣ Validar variables de despliegue"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/validate-env.sh

      - name: "3️⃣ Verificar archivos locales"
        run: |
          echo "📂 Estado del repositorio local:"
          pwd
          echo ""
          echo "📋 Archivos en raíz:"
          ls -la | head -20
          echo ""
          echo "📊 Estadísticas:"
          echo "   Total de archivos: $(find . -type f | wc -l)"
          echo "   Total de directorios: $(find . -type d | wc -l)"
          echo "   Tamaño total: $(du -sh . | cut -f1)"

      - name: "4️⃣ Probar conectividad SSH"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/ssh-test.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD"

      - name: "✅ Preparación completada"
        run: |
          echo "════════════════════════════════════════"
          echo "✅ JOB PREPARE: Completado exitosamente"
          echo "════════════════════════════════════════"
          echo ""
          echo "✓ Credenciales validadas"
          echo "✓ Archivos locales verificados"
          echo "✓ Dependencias instaladas"
          echo "✓ Conectividad SSH verificada"
          echo ""
          echo "Próximo: Transfer & Deploy"
          echo "════════════════════════════════════════"

  transfer-deploy:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [prepare]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: "1️⃣ Instalar dependencias"
        run: |
          echo "📦 Instalando dependencias..."
          sudo apt-get update
          sudo apt-get install -y expect sshpass

      - name: "2️⃣ Transferir archivos vía SCP"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/transfer-files.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD" "." "/var/www/html/instituto"

      - name: "3️⃣ Ejecutar script de despliegue"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/run-deploy.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD" "/var/www/html/instituto"

      - name: "4️⃣ Verificar archivos desplegados"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: bash scripts/verify-deploy.sh "$DEPLOY_USER" "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_PASSWORD" "/var/www/html/instituto"
        continue-on-error: true

      - name: "✅ Resumen del despliegue"
        if: always()
        run: |
          echo "════════════════════════════════════════════════════"
          echo "✅ JOB TRANSFER-DEPLOY: Completado"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "📋 Pasos ejecutados:"
          echo "  1️⃣  Dependencias instaladas"
          echo "  2️⃣  Transferencia de archivos vía SCP"
          echo "  3️⃣  Ejecución del script de despliegue"
          echo "  4️⃣  Verificación de archivos remotos"
          echo ""
          echo "✓ Despliegue finalizado"
          echo "════════════════════════════════════════════════════"
        
