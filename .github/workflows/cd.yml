name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Verificar estructura del repositorio
        run: |
          echo "📁 Contenido del repositorio:"
          ls -la
          echo ""
          echo "📦 Verificando directorios clave:"
          [ -d "wp-content" ] && echo "✓ wp-content encontrado" || echo "✗ wp-content NO encontrado"
          [ -d "wp-admin" ] && echo "✓ wp-admin encontrado" || echo "✗ wp-admin NO encontrado"

      - name: Verificar archivos de configuración
        run: |
          echo "🔧 Archivos de configuración:"
          [ -f "wp-config.php" ] && echo "✓ wp-config.php existe" || echo "✗ wp-config.php NO existe"
          [ -f ".github/workflows/cd.yml" ] && echo "✓ Workflow existe" || echo "✗ Workflow NO existe"

  validation:
    runs-on: ubuntu-latest
    needs: checkout
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Validar variables del environment
        run: |
          echo "🔐 Validando variables y secretos:"
          echo "   DEPLOY_USER: ${DEPLOY_USER:-(no configurado)}"
          echo "   DEPLOY_HOST: ${DEPLOY_HOST:-(no configurado)}"
          echo "   DEPLOY_PORT: ${DEPLOY_PORT:-(no configurado)}"
          echo "   DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:-(no configurado)}"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}

      - name: Verificar conectividad SSH
        run: |
          echo "🔗 Comprobando conectividad SSH:"
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > /dev/null 2>&1 && echo "✓ Host accesible" || echo "✗ Host NO accesible"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    environment: hosting
    needs: [checkout, validation]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          echo "📦 Instalando dependencias necesarias..."
          sudo apt-get update
          sudo apt-get install -y expect
          which expect && echo "✓ expect instalado correctamente" || echo "✗ Error instalando expect"

      - name: Mostrar información de despliegue
        run: |
          echo "🚀 Iniciando despliegue..."
          echo "   Servidor: $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT"
          echo "   Destino: /var/www/html/instituto/"
          echo "   Archivos a transferir: $(find . -type f | wc -l)"
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}

      - name: Desplegar a servidor remoto
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          # Validar que las variables están configuradas
          if [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_PORT" ] || [ -z "$DEPLOY_PASSWORD" ]; then
            echo "❌ Error: Variables de despliegue no configuradas"
            echo "   DEPLOY_USER: ${DEPLOY_USER:-(vacío)}"
            echo "   DEPLOY_HOST: ${DEPLOY_HOST:-(vacío)}"
            echo "   DEPLOY_PORT: ${DEPLOY_PORT:-(vacío)}"
            echo "   DEPLOY_PASSWORD: ${DEPLOY_PASSWORD:+(configurado)}"
            exit 1
          fi
          
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          echo "📤 Transferiendo archivos vía SCP..."
          expect -c "
          set timeout 30
          spawn scp -P $DEPLOY_PORT -r ./* $DEPLOY_USER@$DEPLOY_HOST:/var/www/html/instituto/
          expect {
            \"password:\" {send \"$DEPLOY_PASSWORD\r\"; exp_continue}
            \"Connection refused\" {puts \"ERROR: Conexión rechazada\"; exit 1}
            \"No such file\" {puts \"ERROR: Directorio destino no existe\"; exit 1}
            eof {puts \"✓ Transferencia completada\"}
          }
          "
          
          echo "📋 Ejecutando script de despliegue..."
          expect -c "
          set timeout 60
          spawn ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST \"cd /var/www/html/instituto && bash deploy.sh\"
          expect {
            \"password:\" {send \"$DEPLOY_PASSWORD\r\"; exp_continue}
            \"command not found\" {puts \"ERROR: deploy.sh no encontrado\"; exit 1}
            eof {puts \"✓ Script ejecutado\"}
          }
          "
          
          echo "✅ Despliegue completado"

      - name: Verificar despliegue
        run: |
          echo "🔍 Verificando estado del servidor..."
          expect -c "
          set timeout 30
          spawn ssh -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST \"ls -la /var/www/html/instituto/ | head -20\"
          expect {
            \"password:\" {send \"$DEPLOY_PASSWORD\r\"; exp_continue}
            eof {puts \"✓ Verificación completada\"}
          }
          "
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        continue-on-error: true

      - name: Resumen del despliegue
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "📊 RESUMEN DEL WORKFLOW"
          echo "════════════════════════════════════════"
          echo "✓ Workflow completado"
          echo ""
          echo "📋 Pasos ejecutados:"
          echo "  1. ✓ Checkout del repositorio"
          echo "  2. ✓ Instalación de dependencias"
          echo "  3. ✓ Validación de variables"
          echo "  4. ✓ Transferencia de archivos"
          echo "  5. ✓ Ejecución de deploy.sh"
          echo "  6. ✓ Verificación final"
          echo ""
          echo "📌 Próximos pasos si hay errores:"
          echo "  - Verifica que el environment 'hosting' existe"
          echo "  - Confirma las variables en Settings → Secrets and variables"
          echo "  - Revisa que deploy.sh existe en el servidor remoto"
          echo "════════════════════════════════════════"
        
